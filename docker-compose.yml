version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: daedalus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: daedalus
      POSTGRES_PASSWORD: daedalus_password
      POSTGRES_DB: daedalus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 350M
    command: >
      postgres -c shared_buffers=128MB
               -c work_mem=8MB
               -c max_connections=30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daedalus_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://daedalus:daedalus_password@postgres:5432/daedalus_db
      - GITHUB_WEBHOOK_SECRET=daedalus_secret_key_123
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 250M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daedalus_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 150M

volumes:
  pgdata:
